<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Editor Studio</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your existing CSS -->
    <style>
        .thank-you-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #0f0f0f;
            color: white;
        }
        .thank-you-container i {
            font-size: 5rem;
            color: #00d4ff;
            margin-bottom: 20px;
        }
        .back-home {
            margin-top: 30px;
            text-decoration: none;
            color: #000;
            background: #00d4ff;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-home:hover {
            transform: scale(1.05);
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="thank-you-container">
        <i class="fa-solid fa-circle-check"></i>
        <h1>Message Received!</h1>
        <p>Thank you for reaching out. I'll get back to you within 24 hours.</p>
        <!-- <a href="index.html" class="back-home">Back to Portfolio</a> -->
        <a href="index.html#about" class="back-home">Back to Portfolio</a>
    </div>

</body>
</html>
